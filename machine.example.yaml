# Copy to machine.yaml and edit. All Z values are MACHINE coordinates after homing.
serial:
  port: /dev/ttyUSB0      # Windows: COM3
  baud: 115200
  timeout_s: 60

limits:                    # hard software limits: moves outside are refused
  x_min: 0
  x_max: 200
  y_min: 0
  y_max: 200
  z_min: 0
  z_max: 60

motion:
  feed_xy: 3000
  feed_z: 600
  z_safe: 20               # travel height, tip clear of components
  z_solder: 2              # height where the tip touches the joint
  box_origin_x: 40         # machine X of the reference box's bottom-left corner
  box_origin_y: 30         # machine Y of the reference box's bottom-left corner
  # park_x: 0              # optional: move the tip aside before taking photos
  # park_y: 0
  settle_s: 0.4

solder:
  on_cmd: "M3 S1000"       # GRBL spindle on. Marlin users: e.g. "M106 S255" or "M42 P<pin> S255"
  off_cmd: "M5"
  dwell_s: 1.5
  sync_cmd: "G4 P0"        # Marlin: "M400"
  # home_cmd: "$H"         # GRBL homing. Marlin: "G28"

inspection:
  camera_index: 0
  crop_mm: 4.0             # size of the square photo crop around each joint
  max_retries: 2           # extra passes before flagging a human
  min_change: 2.0
  bright_v: 190
  max_sat: 90
  solder_ratio_min: 0.08   # below -> retry
  solder_ratio_max: 0.45   # above -> human (excess / bridge)
